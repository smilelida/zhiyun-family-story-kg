<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="把执允家族·故事系列长文整理成可检索的家族治理知识图谱：治理专题、家族案例、人物关系、制度工具与原文段落互相链接。" />
    <title>执允·家族故事知识图谱</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="执允·家族故事知识图谱" />
    <meta property="og:title" content="执允·家族故事知识图谱" />
    <meta property="og:description" content="从治理问题进入家族案例：故事、人物、概念、制度工具与原文段落互相链接的研究底稿。" />
    <meta property="og:url" content="https://smilelida.github.io/zhiyun-family-story-kg/" />
    <meta property="og:image" content="https://smilelida.github.io/zhiyun-family-story-kg/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2305392f'/%3E%3Crect x='14' y='16' width='8' height='32' fill='%23f7ecd5'/%3E%3Crect x='28' y='16' width='8' height='32' fill='%23f7ecd5'/%3E%3Crect x='42' y='16' width='8' height='32' fill='%23f7ecd5'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <p class="eyebrow">Family Story Knowledge Graph</p>
          <h1>执允·家族故事知识图谱</h1>
        </div>

        <label class="search">
          <span>搜索</span>
          <input id="searchInput" type="search" placeholder="家族、人物、概念、事件" autocomplete="off" />
        </label>

        <div id="topicFilters" class="topic-filters" aria-label="治理专题筛选"></div>
        <div id="typeFilters" class="type-filters" aria-label="节点类型筛选"></div>
        <nav id="quickNav" class="quick-nav" aria-label="快速入口"></nav>
      </aside>

      <main class="workspace">
        <nav id="topNav" class="top-nav" aria-label="主导航">
          <button data-view="home" aria-current="page">故事地图</button>
          <button data-view="topics">主题索引</button>
          <button data-view="people">人物图谱</button>
          <button data-view="stories">故事列表</button>
          <button data-view="methods">方法论</button>
        </nav>

        <section class="topbar">
          <div>
            <p class="eyebrow">Generated <span id="generatedAt"></span></p>
            <h2 id="viewTitle">故事地图</h2>
            <p id="viewSubtitle" class="view-subtitle">从家族治理问题、案例故事和关系图谱进入 32 篇家族故事。</p>
          </div>
          <div id="stats" class="stats"></div>
        </section>

        <section id="content" class="content-grid"></section>

        <section id="graphSection" class="graph-section">
          <div class="section-heading">
            <h3>关系图谱</h3>
            <div id="graphMode" class="mode-label"></div>
          </div>
          <svg id="graph" role="img" aria-label="知识图谱"></svg>
        </section>
      </main>
    </div>

    <script src="./data/knowledge.js"></script>
    <script src="./data/articles.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
